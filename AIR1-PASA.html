<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Chapter - Paper 3</title>
  <style>
    :root {
      --bg: linear-gradient(135deg,#f9d423,#ff4e50);
      --card:#ffffff;
      --text:#222;
      --valid:#006400;
    }
    *{box-sizing:border-box;}
    body {
      margin:0;
      font-family: Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
      background: var(--bg);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:20px;
    }
    .logo {
      width:120px;
      margin:20px 0;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }
    .title {
      color:#000;
      font-size:26px;
      font-weight:800;
      text-align:center;
      margin:10px 0 20px;
    }
    #mobileDisplay {
      margin-bottom:20px;
      font-size:14px;
      font-weight:500;
      background:rgba(255,255,255,0.4);
      padding:6px 12px;
      border-radius:10px;
      text-align:center;
    }
    .grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* side by side */
  gap: 16px;
  width: 100%;
  max-width: 960px;
}
 @media (max-width: 480px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
    .card {
      background: var(--card);
      border-radius:20px;
      padding:20px;
      text-align:center;
      font-size:16px;
      font-weight:600;
      color:var(--text);
      cursor:pointer;
      box-shadow:0 10px 30px rgba(0,0,0,.12);
      transition:transform .25s ease, box-shadow .25s ease;
      position:relative;
    }
    .card:hover {
      transform:translateY(-4px) scale(1.01);
      box-shadow:0 16px 40px rgba(0,0,0,.18);
    }
    .tick {
      position:absolute;
      top:10px;
      right:12px;
      color:green;
      font-size:22px;
      font-weight:bold;
    }
    .back-btn {
      position:fixed;
      bottom:15px;
      left:50%;
      transform:translateX(-50%);
      padding:10px 18px;
      border:none;
      border-radius:10px;
      background:#444;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
      transition:background 0.25s, transform 0.25s;
      z-index:1000;
    }
    .back-btn:hover { background:#222; transform:translateX(-50%) scale(1.05); }
    .loading {
      margin-top:40px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      color:#fff;
      font-weight:600;
      font-size:15px;
    }
    .spinner {
      border:4px solid rgba(255,255,255,0.3);
      border-top:4px solid #fff;
      border-radius:50%;
      width:40px;
      height:40px;
      animation: spin 1s linear infinite;
    }
.result-banner {
  width: 100%;
  max-width: 960px;
  background: linear-gradient(90deg,#000,#006400);
  color: #fff;
  text-align: center;
  padding: 12px;
  font-size: 16px;
  font-weight: 700;
  border-radius: 12px;
  margin-bottom: 15px;
  animation: slideDown 0.8s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

@keyframes slideDown {
  from { opacity:0; transform:translateY(-20px); }
  to { opacity:1; transform:translateY(0); }
}
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
  </style>
</head>
<body>
  <img src="logo.png" alt="Logo" class="logo">
  <div class="title">📘 PASA Exam: Select a Paper</div>
  <div id="mobileDisplay"></div>
  <div class="result-banner">
  📢 Result on 09th March 2026 at 9 PM
</div>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Loading chapters...</div>
  </div>

  <div class="grid" id="sheetCards" style="display:none;"></div>
  <button class="back-btn" onclick="location.href='Dash.html'">⬅ Back</button>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-yZa0LrzrY2qGzFWsFuF2FROjPfS38wqQS9LAbpQJnggK8mOyTanydNjMjH01-FKX/exec";
  const sheetCards = document.getElementById("sheetCards");
  const mobileDisplay = document.getElementById("mobileDisplay");
  const loading = document.getElementById("loading");

  // ✅ Exam Date Settings
  const examStart = new Date("2026-03-15T00:00:00");
  const examEnd   = new Date("2026-03-16T23:59:59");
  const now = new Date();

  let mobile = localStorage.getItem("mobile");

  window.onload = async () => {

    mobileDisplay.innerText = mobile ? "📱 " + mobile : "📱 Not logged in";

    // ✅ Show lock message before exam
    if (now < examStart) {
      document.querySelector(".result-banner").innerHTML =
        "🔒 Exam will be live on 15.03.2026 to 16.03.2026";
      document.querySelector(".result-banner").style.background =
        "linear-gradient(90deg,#800000,#000)";
    }

    try {
      let res = await fetch(SCRIPT_URL + "?action=getSheets");
      if (!res.ok) throw new Error("Network error");
      let sheets = await res.json();

      sheets = sheets.filter(name => name !== "Responses");

      let attemptedRes = await fetch(SCRIPT_URL + "?action=getAttempted&mobile=" + encodeURIComponent(mobile));
      let attempted = await attemptedRes.json();

      loading.style.display = "none";
      sheetCards.style.display = "grid";

      sheets.forEach(name => {

        let card = document.createElement("div");
        card.className = "card";
        card.innerText = name.trim();

        let attemptedList = Array.isArray(attempted)
          ? attempted.map(a => a.trim())
          : [];

        let isAttempted = attemptedList.includes(name.trim());

        // 🔒 FULL LOCK before exam date
        if (now < examStart) {

          let lock = document.createElement("div");
          lock.className = "tick";
          lock.innerText = "🔒";
          card.appendChild(lock);

          card.style.opacity = "0.6";
          card.style.pointerEvents = "none";
          card.style.cursor = "not-allowed";
          card.style.background = "#eee";

        }
        // ✔ Lock if already attempted
        else if (isAttempted) {

          let tick = document.createElement("div");
          tick.className = "tick";
          tick.innerText = "✔";
          card.appendChild(tick);

          card.style.opacity = "0.6";
          card.style.pointerEvents = "none";
          card.style.cursor = "not-allowed";
          card.style.background = "#eee";

        }
        else {

          card.onclick = () => {
            window.location.href =
              `quizair1-pasa.html?sheet=${encodeURIComponent(name)}`;
          };
        }

        sheetCards.appendChild(card);
      });

    } catch (err) {
      console.error("Error loading data", err);
      loading.innerHTML = "<div style='color:#fff;'>⚠ Failed to load chapters</div>";
    }
  };
</script>
</body>
</html>
